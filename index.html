<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>都道府県クイズ — Japan Prefecture Quiz</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1d2230; --line:#2a3140;
    --ink:#e8ecf3; --dim:#8b95a7;
    --accent:#ff7a45; --ok:#3ddc97; --bad:#ff5d6c; --hint:#5aa9ff;
    /* the map has its own light palette, deeper-toned so it reads on a pale ground */
    --sea:#6fb0e0; --sea-deep:#5b97c8;
    --land:#f8f3e9; --land-edge:#c3b096;
    --oos:#a9c4da; --oos-edge:#8fadc8;
    --m-target:#ee6a2b; --m-ok:#2da76f; --m-bad:#d83f52;
    --outline:#1e3d58;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:minmax(0,1fr) 380px; height:100vh; height:100dvh}
  /* ---------- map ---------- */
  .mapwrap{position:relative; background:linear-gradient(170deg,var(--sea) 0%,var(--sea-deep) 100%); overflow:hidden; display:flex; align-items:center; justify-content:center}
  svg{width:100%; height:100%; display:block; touch-action:none}
  .pref{fill:var(--land); stroke:var(--land-edge); stroke-width:1.1; stroke-linejoin:round; vector-effect:non-scaling-stroke}
  .pref.oos{fill:var(--oos); stroke:var(--oos-edge)}
  .pref.hovered{fill:#efe6d4}
  .pref.correct{fill:var(--m-ok)}
  .pref.wrong{fill:var(--m-bad)}
  .pref.target{fill:var(--m-target)}
  #gOutline path{fill:none; stroke:var(--outline); stroke-width:6; stroke-linejoin:round; opacity:.9}
  #ring{fill:none; stroke:var(--m-target); stroke-width:3.2; stroke-dasharray:8 6; opacity:.95;
        vector-effect:non-scaling-stroke; transform-box:fill-box; transform-origin:center}
  #ring.ok{stroke:var(--m-ok)} #ring.bad{stroke:var(--m-bad)}
  #insetbox{fill:none; stroke:#cfe3f3; stroke-width:1.2; stroke-dasharray:5 5; vector-effect:non-scaling-stroke}
  #insetlabel{fill:#e2eff9; font-size:15px}
  .lbl{fill:#4b4133; font-size:14px; text-anchor:middle; pointer-events:none; paint-order:stroke;
       stroke:rgba(255,255,255,.92); stroke-width:3px; stroke-linejoin:round}
  @keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.06)}}
  #ring.pulse{animation:pulse 1.9s ease-in-out infinite}
  .maptop{position:absolute; top:14px; left:14px; right:14px; display:flex; gap:8px; align-items:center; pointer-events:none}
  .chip{pointer-events:auto; background:rgba(255,255,255,.86); border:1px solid #a7c3d5; color:#3a5a72;
        border-radius:999px; padding:6px 13px; font-size:12px; cursor:pointer; backdrop-filter:blur(8px);
        box-shadow:0 1px 3px rgba(20,50,70,.12)}
  .chip:hover{color:#12293c; border-color:#7aa5c0; background:#fff}
  .chip.on{color:#fff; background:#3d6280; border-color:#3d6280}
  .chip.mode{border-color:#7aa5c0; color:#12293c; font-weight:600}
  .chip.hidden{display:none}
  .spacer{flex:1}
  /* ---------- panel ---------- */
  .panel{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0}
  .phead{padding:20px 22px 16px; border-bottom:1px solid var(--line)}
  .title{font-size:19px; font-weight:650; letter-spacing:.02em}
  .sub{font-size:12px; color:var(--dim); margin-top:3px}
  .stats{display:flex; gap:0; border-bottom:1px solid var(--line)}
  .stat{flex:1; padding:13px 10px; text-align:center; border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .snum{font-size:21px; font-weight:650; font-variant-numeric:tabular-nums}
  .slab{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.09em; margin-top:2px}
  .bar{height:3px; background:var(--panel2)}
  .bar>i{display:block; height:100%; background:var(--accent); transition:width .35s ease}
  .body{flex:1; padding:22px; overflow-y:auto; display:flex; flex-direction:column}
  .prompt{font-size:13px; color:var(--dim); margin-bottom:10px}
  input[type=text]{
    width:100%; background:var(--panel2); border:1.5px solid var(--line); color:var(--ink);
    font-size:23px; padding:13px 15px; border-radius:11px; outline:none; font-family:inherit;
  }
  input[type=text]:focus{border-color:#4a566d}
  input.ok{border-color:var(--ok)} input.bad{border-color:var(--bad)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  input.shake{animation:shake .45s}
  .row{display:flex; gap:9px; margin-top:11px}
  button{
    font-family:inherit; font-size:13px; padding:10px 15px; border-radius:9px; cursor:pointer;
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
  }
  button:hover{color:var(--ink); border-color:#3d4759}
  button:disabled{opacity:.4; cursor:default}
  button:disabled:hover{color:var(--dim); border-color:var(--line)}
  button.primary{background:var(--accent); color:#1a0d06; border-color:var(--accent); font-weight:600}
  button.primary:hover{filter:brightness(1.1); color:#1a0d06}
  .fb{margin-top:16px; min-height:120px}
  .verdict{font-size:14px; font-weight:600; margin-bottom:11px; display:flex; align-items:center; gap:8px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.hint{color:var(--hint)}
  .card{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:15px 17px}
  .kanji{font-size:31px; font-weight:600; letter-spacing:.04em}
  .kana{font-size:14px; color:var(--dim); margin-top:5px}
  .meta{font-size:12px; color:var(--dim); margin-top:9px; padding-top:9px; border-top:1px solid var(--line); line-height:1.6}
  .yours{font-size:12px; color:var(--dim); margin-top:10px}
  .yours b{color:var(--bad); font-weight:600}
  .hrow{display:flex; gap:11px; align-items:flex-start}
  .hrow.more{margin-top:13px; padding-top:13px; border-top:1px solid var(--line)}
  .hnum{flex:none; width:19px; height:19px; border-radius:50%; background:var(--line); color:var(--dim);
        font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:2px}
  .fam{font-size:15.5px; line-height:2.05}
  .fam ruby{ruby-position:over; -webkit-ruby-position:before}
  .fam rt{color:#79c2ff; font-size:.52em; font-weight:400; letter-spacing:.02em;
          transform:translateY(2px); user-select:none}
  .famen{font-size:12.5px; color:var(--dim); line-height:1.55; margin-top:6px}
  .foot{padding:13px 22px; border-top:1px solid var(--line); font-size:11px; color:#606a7c; display:flex; gap:14px; flex-wrap:wrap}
  kbd{background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 5px; font-size:10px; font-family:inherit}
  /* ---------- results ---------- */
  .results{display:flex; flex-direction:column; gap:14px}
  .big{font-size:44px; font-weight:700; line-height:1}
  .misslist{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .missrow{background:var(--panel2); padding:9px 13px; display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .missrow span:last-child{font-size:11px; color:var(--dim)}
  .hidden{display:none}
  @media (max-width:900px){
    .app{grid-template-columns:1fr; grid-template-rows:minmax(240px,44vh) 1fr; height:auto; min-height:100dvh}
    .panel{border-left:0; border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <div class="maptop">
      <button class="chip mode" id="modeBtn">都道府県を当てる</button>
      <button class="chip" id="regionBtn">全国 · all Japan</button>
      <div class="spacer"></div>
      <button class="chip" id="namesBtn">名前を表示</button>
    </div>
    <svg id="map" viewBox="0 0 1036.0 1297.6" preserveAspectRatio="xMidYMid meet">
      <g id="gOos"></g>
      <g id="gOutline"></g>
      <g id="gIn"></g>
      <rect id="insetbox" x="35.3" y="35.3" width="313.6" height="194.4" rx="6"></rect>
      <text id="insetlabel" x="44.3" y="219.7">沖縄</text>
      <g id="labels"></g>
      <circle id="ring" class="pulse" cx="0" cy="0" r="0"></circle>
    </svg>
  </div>

  <div class="panel">
    <div class="phead">
      <div class="title" id="hTitle">都道府県クイズ</div>
      <div class="sub" id="hSub">Name the highlighted prefecture</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="snum" id="sScore">0</div><div class="slab">correct</div></div>
      <div class="stat"><div class="snum" id="sSeen">0/47</div><div class="slab">progress</div></div>
      <div class="stat"><div class="snum" id="sStreak">0</div><div class="slab">streak</div></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>

    <div class="body">
      <div id="playView">
        <div class="prompt" id="prompt">オレンジ色の都道府県は？ &nbsp;·&nbsp; kanji, kana or romaji</div>
        <input type="text" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例: 三重県 / みえ / mie">
        <div class="row">
          <button class="primary" id="submitBtn">答える</button>
          <button id="hintBtn">ヒント</button>
          <button id="revealBtn">答えを見る</button>
        </div>
        <div class="fb" id="fb"></div>
      </div>
      <div id="resultView" class="hidden"></div>
    </div>

    <div class="foot">
      <span><kbd>Enter</kbd> 答える / 次へ</span>
      <span><kbd>?</kbd> ヒント</span>
      <span id="restartFoot" style="cursor:pointer;text-decoration:underline">最初から</span>
    </div>
  </div>
</div>

          ['<ruby>日本最大<rt>にほんさいだい</rt></ruby>の<ruby>湖<rt>みずうみ</rt></ruby>と、<ruby>伊勢神宮<rt>いせじんぐう</rt></ruby>がある','Home to Japan’s largest lake, and to the Grand Shrine of Ise']]},
  {key:'cgk', ja:'中国', en:'Chugoku', kana:'ちゅうごく', romaji:'chugoku', ids:[31,32,33,34,35],
   hints:[['<ruby>本州<rt>ほんしゅう</rt></ruby>の<ruby>西端<rt>せいたん</rt></ruby>を<ruby>占<rt>し</rt></ruby>める5<ruby>県<rt>けん</rt></ruby>','Five prefectures at the western end of Honshu'],
          ['<ruby>山陰<rt>さんいん</rt></ruby>と<ruby>山陽<rt>さんよう</rt></ruby>に<ruby>分<rt>わ</rt></ruby>かれ、<ruby>日本海<rt>にほんかい</rt></ruby>と<ruby>瀬戸内海<rt>せとないかい</rt></ruby>に<ruby>面<rt>めん</rt></ruby>する','Split into the San’in and San’yo coasts, facing the Sea of Japan and the Inland Sea'],
          ['<ruby>出雲大社<rt>いずもたいしゃ</rt></ruby>、<ruby>原爆<rt>げんばく</rt></ruby>ドーム、そして<ruby>大砂丘<rt>だいさきゅう</rt></ruby>','Izumo Taisha, the A-Bomb Dome, and the great sand dunes']]},
  {key:'shi', ja:'四国', en:'Shikoku', kana:'しこく', romaji:'shikoku', ids:[36,37,38,39],
   hints:[['4<ruby>県<rt>けん</rt></ruby>からなり、<ruby>本土<rt>ほんど</rt></ruby>4<ruby>島<rt>とう</rt></ruby>で<ruby>最<rt>もっと</rt></ruby>も<ruby>小<rt>ちい</rt></ruby>さい<ruby>島<rt>しま</rt></ruby>','Four prefectures on the smallest of Japan’s four main islands'],
          ['88ヶ<ruby>所<rt>しょ</rt></ruby>の<ruby>霊場<rt>れいじょう</rt></ruby>を<ruby>巡<rt>めぐ</rt></ruby>るお<ruby>遍路<rt>へんろ</rt></ruby>','The 88-temple pilgrimage circuit walked by white-clad henro'],
          ['うどん、カツオのたたき、<ruby>阿波踊<rt>あわおど</rt></ruby>り','Udon, seared bonito, and the Awa Odori dance']]},
  {key:'kyu', ja:'九州・沖縄', en:'Kyushu & Okinawa', kana:'きゅうしゅう', romaji:'kyushu', ids:[40,41,42,43,44,45,46,47],
   alts:['九州','九州沖縄','kyushuokinawa'],
   hints:[['<ruby>日本<rt>にほん</rt></ruby>の<ruby>南西部<rt>なんせいぶ</rt></ruby>にある8<ruby>県<rt>けん</rt></ruby>','Eight prefectures across the southwest of Japan'],
          ['<ruby>火山<rt>かざん</rt></ruby>と<ruby>温泉<rt>おんせん</rt></ruby>が<ruby>多<rt>おお</rt></ruby>く、<ruby>阿蘇山<rt>あそさん</rt></ruby>や<ruby>桜島<rt>さくらじま</rt></ruby>がそびえる','Volcanoes and hot springs everywhere, with Mt. Aso and Sakurajima looming over it'],
          ['<ruby>古<rt>ふる</rt></ruby>くから<ruby>大陸<rt>たいりく</rt></ruby>への<ruby>玄関口<rt>げんかんぐち</rt></ruby>だった','For centuries, Japan’s gateway to the Asian mainland']]},
];
const REGION_OF = {};
REGIONS.forEach(r => r.ids.forEach(id => REGION_OF[id] = r));
const REGION_BY_KEY = {};
REGIONS.forEach(r => REGION_BY_KEY[r.key] = r);

// ---------- answer normalisation ----------
const SUFFIX = /(県|府|都|道)$/;
// kanji ender -> [kana ender, romaji ender]
const ENDER = {'県':['けん','ken'], '府':['ふ','fu'], '都':['と','to'], '道':['どう','do']};

function katakanaToHiragana(s){
  return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
// A pure normaliser: it never strips a name's own ending, so 京都 stays 京都.
// Which endings are optional is decided by variantsFor*, which lists both forms.
function norm(s){
  s = (s||'').trim().toLowerCase().normalize('NFKC');
  s = s.replace(/[ōô]/g,'o').replace(/[ūû]/g,'u').replace(/[āâ]/g,'a')
       .replace(/[ēê]/g,'e').replace(/[īî]/g,'i');
  s = s.replace(/[\s　'’\-_.・･]/g,'');
  s = katakanaToHiragana(s);
  s = s.replace(/(地方|ちほう)$/,'');
  // long vowels are only ambiguous in romaji: tokyo == toukyou == tōkyō, gunma == gumma
  if (/^[a-z]+$/.test(s)) s = s.replace(/mm/g,'nm').replace(/ou/g,'o').replace(/oo/g,'o').replace(/uu/g,'u');
  return s;
}

// every prefecture answers to its full name and its bare name, in kanji, kana and romaji
function variantsForPref(id){
  const ja = MAP.prefs[id].ja, [kana, romaji] = READ[id];
  const [ks, rs] = ENDER[ja.slice(-1)];
  // READ holds 北海道's reading with its ender attached; every other entry omits it
  const kanaBase = kana.endsWith(ks)   ? kana.slice(0, -ks.length)   : kana;
  const romaBase = romaji.endsWith(rs) ? romaji.slice(0, -rs.length) : romaji;
  return [ja, ja.slice(0,-1), kanaBase + ks, kanaBase, romaBase + rs, romaBase];
}
function acceptedForPref(id){
  const set = new Set(variantsForPref(id).map(norm));
  set.delete('');
  return set;
}
function acceptedForRegion(key){
  const r = REGION_BY_KEY[key];
  const set = new Set([r.ja, r.kana, r.romaji, ...(r.alts||[])].map(norm));
  set.delete('');
  return set;
}
const accepted = k => mode === 'region' ? acceptedForRegion(k) : acceptedForPref(k);

// ---------- build the map ----------
const svg = document.getElementById('map');
const gOos = document.getElementById('gOos');
const gOutline = document.getElementById('gOutline');
const gIn = document.getElementById('gIn');
const labels = document.getElementById('labels');
const ring = document.getElementById('ring');
const nodes = {};
const IDS = Object.keys(MAP.prefs).map(Number).sort((a,b)=>a-b);
const SVGNS = 'http://www.w3.org/2000/svg';

for (const id of IDS){
  const p = MAP.prefs[id];
  const el = document.createElementNS(SVGNS,'path');
  el.setAttribute('d', p.d);
  el.setAttribute('class','pref');
  el.dataset.id = id;
  gIn.appendChild(el);
  nodes[id] = el;

  const t = document.createElementNS(SVGNS,'text');
  t.setAttribute('class','lbl');
  t.setAttribute('x', p.c[0]); t.setAttribute('y', p.c[1] + 5);
  t.textContent = id === 1 ? '北海道' : p.ja.replace(SUFFIX,'');
  labels.appendChild(t);
}
labels.style.display = 'none';

// ---------- game state ----------
let mode = 'pref';           // 'pref' = name the prefecture, 'region' = name the region
let region = ALL;            // scope filter, prefecture mode only
let queue = [], current = null, idx = 0, score = 0, streak = 0, best = 0;
let attempts = 0, awaitingNext = false, missed = [], hintLevel = 0;
let results = {};            // key -> 'correct' | 'wrong', kept for the whole round

const $ = s => document.querySelector(s);
const input = $('#answer'), fb = $('#fb');

const scopeIds = () => mode === 'region' ? IDS : (region.ids || IDS);
const inScope = id => mode === 'region' || !region.ids || region.ids.includes(id);
const keyOf = id => mode === 'region' ? REGION_OF[id].key : id;
const isTarget = id => current !== null && keyOf(id) === current;
const nameOf = k => mode === 'region' ? REGION_BY_KEY[k].ja : MAP.prefs[k].ja;
const readingOf = k => mode === 'region' ? [REGION_BY_KEY[k].kana, REGION_BY_KEY[k].romaji] : READ[k];
const hintsOf = k => mode === 'region' ? REGION_BY_KEY[k].hints : HINTS[k];

// every prefecture's colour is derived from state, so results stay painted
function paint(){
  for (const id of IDS){
    const c = ['pref'];
    if (!inScope(id)) c.push('oos');
    const res = results[keyOf(id)];
    if (isTarget(id) && !awaitingNext) c.push('target');
    else if (res) c.push(res);
    nodes[id].setAttribute('class', c.join(' '));
  }
}

// out-of-scope fills first, then the region outline, then in-scope fills on top:
// each in-scope path's stroke is covered by its neighbours' fills, leaving only the outer edge
function layout(){
  const ids = scopeIds();
  gOutline.textContent = '';
  for (const id of IDS) (ids.includes(id) ? gIn : gOos).appendChild(nodes[id]);
  if (mode === 'pref' && region.ids){
    for (const id of ids){
      const o = document.createElementNS(SVGNS,'path');
      o.setAttribute('d', MAP.prefs[id].d);
      gOutline.appendChild(o);
    }
  }
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; }

function startRound(items){
  queue = shuffle(items ? items.slice()
        : mode === 'region' ? REGIONS.map(r => r.key) : (region.ids || IDS).slice());
  idx = 0; score = 0; streak = 0; missed = []; results = {}; current = null;
  $('#playView').classList.remove('hidden');
  $('#resultView').classList.add('hidden');
  layout();
  next();
}

function next(){
  if (idx >= queue.length) return finish();
  current = queue[idx];
  attempts = 0; awaitingNext = false; hintLevel = 0;
  $('#hintBtn').disabled = false; $('#hintBtn').textContent = 'ヒント';
  $('#revealBtn').disabled = false;
  paint(); placeRing('');
  input.value = ''; input.className = ''; input.disabled = false; input.focus();
  fb.innerHTML = '';
  $('#submitBtn').textContent = '答える';
  updateStats();
}

function placeRing(cls){
  if (mode === 'region'){ ring.setAttribute('r', 0); return; }   // the whole region is coloured already
  const b = MAP.prefs[current].b;
  const cx = (b[0]+b[2])/2, cy = (b[1]+b[3])/2;
  const r = Math.max(Math.hypot(b[2]-b[0], b[3]-b[1]) / 2 + 26, 46);
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', r);
  ring.setAttribute('class', 'pulse ' + cls);
}

function updateStats(){
  $('#sScore').textContent = score;
  $('#sSeen').textContent = idx + '/' + queue.length;
  $('#sStreak').textContent = streak;
  $('#bar').style.width = (queue.length ? idx/queue.length*100 : 0) + '%';
}

function card(k, extra){
  const [kana, romaji] = readingOf(k);
  let meta;
  if (mode === 'region'){
    const r = REGION_BY_KEY[k];
    meta = r.ids.length + '都道府県 · ' + r.ids.map(i => MAP.prefs[i].ja.replace(SUFFIX,'')).join('、');
    if (r.aka) meta = '別名「' + r.aka[0] + '」 · also called ' + r.aka[1] + '<br>' + meta;
  } else {
    const r = REGION_OF[k];
    meta = r.ja + '地方 · ' + r.en;
  }
  return '<div class="card"><div class="kanji">' + nameOf(k) + '</div>' +
    '<div class="kana">' + kana + ' · ' + romaji.charAt(0).toUpperCase() + romaji.slice(1) + '</div>' +
    '<div class="meta">' + meta + '</div></div>' + (extra || '');
}

function submit(){
  if (awaitingNext){ idx++; next(); return; }
  const raw = input.value.trim();
  if (!raw) return;
  if (accepted(current).has(norm(raw))) {
    score++; streak++; best = Math.max(best, streak);
    results[current] = 'correct';
    awaitingNext = true;
    paint(); placeRing('ok');
    input.className = 'ok'; input.disabled = true;
    fb.innerHTML = '<div class="verdict ok">✓ 正解！ Correct</div>' + card(current);
    endQuestion();
  } else {
    attempts++; streak = 0;
    input.classList.remove('shake'); void input.offsetWidth; input.className = 'bad shake';
    if (attempts < 2) {
      fb.innerHTML = '<div class="verdict bad">✕ ちがいます — もう一度 (1 try left)</div>' +
        '<div class="yours">あなたの答え: <b>' + escapeHtml(raw) + '</b></div>';
      input.select();
    } else {
      reveal(raw);
    }
  }
  updateStats();
}

function reveal(raw){
  results[current] = 'wrong';
  missed.push(current);
  streak = 0;
  awaitingNext = true;
  paint(); placeRing('bad');
  input.disabled = true; input.className = 'bad';
  const yours = raw ? '<div class="yours">あなたの答え: <b>' + escapeHtml(raw) + '</b></div>' : '';
  fb.innerHTML = '<div class="verdict bad">✕ 正解は…</div>' + card(current, yours);
  endQuestion();
  updateStats();
}

function endQuestion(){
  $('#hintBtn').disabled = true;
  $('#revealBtn').disabled = true;
  $('#submitBtn').textContent = idx + 1 >= queue.length ? '結果を見る' : '次へ →';
  $('#submitBtn').focus();
}

// three facts, revealed one at a time; earlier ones stay on screen
function hint(){
  if (awaitingNext || hintLevel >= 3) return;
  hintLevel++;
  const rows = hintsOf(current).slice(0, hintLevel).map((h, i) =>
    '<div class="hrow' + (i ? ' more' : '') + '"><span class="hnum">' + (i+1) + '</span>' +
    '<div><div class="fam">' + h[0] + '</div><div class="famen">' + h[1] + '</div></div></div>').join('');
  fb.innerHTML = '<div class="verdict hint">ヒント · known for &nbsp;<span style="color:var(--dim);font-weight:400">' +
    hintLevel + '/3</span></div><div class="card">' + rows + '</div>';
  if (hintLevel >= 3) $('#hintBtn').disabled = true;
  else $('#hintBtn').textContent = 'もっと';
  input.focus();
}

function finish(){
  current = null;
  ring.setAttribute('r', 0);
  paint();
  const pct = Math.round(score / queue.length * 100);
  const rows = missed.map(k => {
    const [kana, romaji] = readingOf(k);
    return '<div class="missrow"><span>' + nameOf(k) + '</span><span>' + kana + ' · ' + romaji + '</span></div>';
  }).join('');
  $('#playView').classList.add('hidden');
  const rv = $('#resultView');
  rv.classList.remove('hidden');
  const label = mode === 'region' ? '地方' : region.ja;
  rv.innerHTML = '<div class="results">' +
    '<div><div class="big">' + score + ' / ' + queue.length + '</div>' +
    '<div class="sub" style="margin-top:6px">' + pct + '% · 最長連続 ' + best + '</div></div>' +
    (missed.length
      ? '<div><div class="prompt">まちがえた' + (mode === 'region' ? '地方' : '都道府県') +
        ' (' + missed.length + ')</div><div class="misslist">' + rows + '</div></div>'
      : '<div class="verdict ok">全問正解！ Perfect round 🎌</div>') +
    '<div class="row"><button class="primary" id="againBtn">もう一度 (' + label + ')</button>' +
    (missed.length ? '<button id="reviewBtn">まちがえた' + missed.length + '問だけ</button>' : '') +
    '</div></div>';
  $('#againBtn').onclick = () => startRound();
  const rb = $('#reviewBtn'); if (rb) { const m = missed.slice(); rb.onclick = () => startRound(m); }
  updateStats();
  $('#sSeen').textContent = queue.length + '/' + queue.length;
  $('#bar').style.width = '100%';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- controls ----------
$('#submitBtn').onclick = submit;
$('#hintBtn').onclick = hint;
$('#revealBtn').onclick = () => { if (!awaitingNext) reveal(input.value.trim()); };
$('#restartFoot').onclick = () => startRound();

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); }
});
document.addEventListener('keydown', e => {
  if (e.target === input) return;
  if ((e.key === 'Enter' || e.key === ' ') && awaitingNext) { e.preventDefault(); submit(); }
  if (e.key === '?') { e.preventDefault(); hint(); }
});

$('#modeBtn').onclick = () => {
  mode = mode === 'pref' ? 'region' : 'pref';
  const isRegion = mode === 'region';
  $('#modeBtn').textContent = isRegion ? '地方を当てる' : '都道府県を当てる';
  $('#regionBtn').classList.toggle('hidden', isRegion);
  $('#hTitle').textContent = isRegion ? '地方クイズ' : '都道府県クイズ';
  $('#hSub').textContent = isRegion ? 'Name the highlighted region' : 'Name the highlighted prefecture';
  $('#prompt').innerHTML = isRegion
    ? 'オレンジ色の地方は？ &nbsp;·&nbsp; kanji, kana or romaji'
    : 'オレンジ色の都道府県は？ &nbsp;·&nbsp; kanji, kana or romaji';
  input.placeholder = isRegion ? '例: 関東 / かんとう / kanto' : '例: 三重県 / みえ / mie';
  startRound();
};

let ri = 0;
const SCOPES = [ALL, ...REGIONS];
$('#regionBtn').onclick = () => {
  ri = (ri + 1) % SCOPES.length;
  region = SCOPES[ri];
  $('#regionBtn').textContent = region.ja + ' · ' + region.en;
  startRound();
};

let showNames = false;
$('#namesBtn').onclick = () => {
  showNames = !showNames;
  labels.style.display = showNames ? '' : 'none';
  $('#namesBtn').classList.toggle('on', showNames);
  $('#namesBtn').textContent = showNames ? '名前を隠す' : '名前を表示';
};

svg.addEventListener('mousemove', e => {
  const el = e.target.closest('.pref'); if (!el || !showNames) return;
  el.classList.add('hovered');
  el.addEventListener('mouseleave', () => el.classList.remove('hovered'), {once:true});
});
svg.addEventListener('click', e => {
  const el = e.target.closest('.pref'); if (!el || !showNames) return;
  const id = +el.dataset.id;
  alert(MAP.prefs[id].ja + '  ' + READ[id][0] + '  ' + READ[id][1] + '\n' + REGION_OF[id].ja + '地方');
});

startRound();
</script>
