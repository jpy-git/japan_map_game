<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>都道府県クイズ — Map Quiz</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1d2230; --line:#2a3140;
    --ink:#e8ecf3; --dim:#8b95a7;
    --accent:#ff7a45; --ok:#3ddc97; --bad:#ff5d6c; --hint:#5aa9ff;
    /* the map has its own light palette, deeper-toned so it reads on a pale ground */
    --sea:#6fb0e0; --sea-deep:#5b97c8;
    --land:#f8f3e9; --land-edge:#c3b096;
    --oos:#a9c4da; --oos-edge:#8fadc8;
    --m-target:#ee6a2b; --m-ok:#2da76f; --m-bad:#d83f52;
    --outline:#1e3d58;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:minmax(0,1fr) 380px; height:100vh; height:100dvh}
  /* ---------- map ---------- */
  .mapwrap{position:relative; background:linear-gradient(170deg,var(--sea) 0%,var(--sea-deep) 100%); overflow:hidden; display:flex; align-items:center; justify-content:center}
  #map{width:100%; height:100%; display:block; touch-action:none}
  .pref{fill:var(--land); stroke:var(--land-edge); stroke-width:1.1; stroke-linejoin:round; vector-effect:non-scaling-stroke}
  .pref.oos{fill:var(--oos); stroke:var(--oos-edge)}
  .pref.hovered{fill:#efe6d4}
  .pref.correct{fill:var(--m-ok)}
  .pref.wrong{fill:var(--m-bad)}
  .pref.target{fill:var(--m-target)}
  #gOutline path{fill:none; stroke:var(--outline); stroke-width:6; stroke-linejoin:round; opacity:.9;
                  vector-effect:non-scaling-stroke}
  #ring{fill:none; stroke:var(--m-target); stroke-width:3.2; stroke-dasharray:8 6; opacity:.95;
        vector-effect:non-scaling-stroke; transform-box:fill-box; transform-origin:center}
  #ring.ok{stroke:var(--m-ok)} #ring.bad{stroke:var(--m-bad)}
  #insetbox{fill:none; stroke:#cfe3f3; stroke-width:1.2; stroke-dasharray:5 5; vector-effect:non-scaling-stroke}
  #insetlabel{fill:#e2eff9}
  .lbl{fill:#4b4133; text-anchor:middle; pointer-events:none; paint-order:stroke;
       stroke:rgba(255,255,255,.92); stroke-width:3px; stroke-linejoin:round}
  @keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.06)}}
  #ring.pulse{animation:pulse 1.9s ease-in-out infinite}
  #ring.faded{opacity:0 !important}
  .maptop{position:absolute; top:14px; left:14px; right:14px; display:flex; gap:8px; align-items:center; pointer-events:none}
  .chip{pointer-events:auto; background:rgba(255,255,255,.86); border:1px solid #a7c3d5; color:#3a5a72;
        border-radius:999px; padding:6px 13px; font-size:12px; cursor:pointer; backdrop-filter:blur(8px);
        box-shadow:0 1px 3px rgba(20,50,70,.12); white-space:nowrap}
  .chip:hover{color:#12293c; border-color:#7aa5c0; background:#fff}
  .chip.on{color:#fff; background:#3d6280; border-color:#3d6280}
  .chip.mode{border-color:#7aa5c0; color:#12293c; font-weight:600}
  .chip.country{background:#3d6280; border-color:#3d6280; color:#fff; font-weight:600}
  .chip.country:hover{background:#2f5069; color:#fff}
  .chip.hidden{display:none}
  .spacer{flex:1}
  /* ---------- map chrome ---------- */
  .mapwrap{cursor:grab}
  .mapwrap.dragging{cursor:grabbing}
  .mapui{position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; gap:1px;
         border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.18)}
  .mapui button{width:40px; height:40px; padding:0; border:0; border-radius:0; font-size:16px;
                background:rgba(14,16,20,.68); color:#e8ecf3; backdrop-filter:blur(10px)}
  .mapui button:hover{background:rgba(14,16,20,.92); color:#fff}
  .mapui button.sm{font-size:9.5px; letter-spacing:-.2px; white-space:nowrap}
  .mapui button:disabled{color:#69748a}
  .mapui button:disabled:hover{background:rgba(14,16,20,.68); color:#69748a}
  .locator{position:absolute; left:16px; bottom:16px; width:104px; padding:5px; cursor:pointer;
           background:rgba(14,16,20,.9); border:1px solid rgba(255,255,255,.22); border-radius:10px;
           backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity .18s ease}
  .locator.on{opacity:1; pointer-events:auto}
  .locator svg{display:block; width:100%; height:auto}
  .locator path{fill:#dfe7ef; stroke:none}
  .locator #locvp{fill:rgba(255,122,69,.20); stroke:var(--accent); stroke-width:2;
                  vector-effect:non-scaling-stroke}
  .maptip{position:absolute; left:50%; bottom:16px; transform:translate(-50%,6px); max-width:min(320px,84%);
          background:rgba(14,16,20,.86); border:1px solid rgba(255,255,255,.16); border-radius:11px;
          padding:10px 14px; color:var(--ink); font-size:13px; line-height:1.5; text-align:center;
          opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
          backdrop-filter:blur(10px)}
  .maptip.on{opacity:1; transform:translate(-50%,0)}
  .maptip b{font-size:15px}
  .maptip span{color:var(--dim); font-size:12px}
  /* ---------- sheet header, chips only (mobile) ---------- */
  .sheetgrip{display:none}
  /* ---------- panel ---------- */
  .panel{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0}
  .phead{padding:20px 22px 16px; border-bottom:1px solid var(--line)}
  .title{font-size:19px; font-weight:650; letter-spacing:.02em}
  .sub{font-size:12px; color:var(--dim); margin-top:3px}
  .stats{display:flex; gap:0; border-bottom:1px solid var(--line)}
  .stat{flex:1; padding:13px 10px; text-align:center; border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .snum{font-size:21px; font-weight:650; font-variant-numeric:tabular-nums}
  .slab{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.09em; margin-top:2px}
  .bar{height:3px; background:var(--panel2)}
  .bar>i{display:block; height:100%; background:var(--accent); transition:width .35s ease}
  .body{flex:1; min-height:0; padding:22px; overflow-y:auto; display:flex; flex-direction:column}
  .prompt{font-size:13px; color:var(--dim); margin-bottom:10px}
  input[type=text]{
    width:100%; background:var(--panel2); border:1.5px solid var(--line); color:var(--ink);
    font-size:23px; padding:13px 15px; border-radius:11px; outline:none; font-family:inherit;
  }
  input[type=text]:focus{border-color:#4a566d}
  input.ok{border-color:var(--ok)} input.bad{border-color:var(--bad)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  input.shake{animation:shake .45s}
  .row{display:flex; gap:9px; margin-top:11px}
  button{
    font-family:inherit; font-size:13px; padding:10px 15px; border-radius:9px; cursor:pointer;
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
  }
  button:hover{color:var(--ink); border-color:#3d4759}
  button:disabled{opacity:.4; cursor:default}
  button:disabled:hover{color:var(--dim); border-color:var(--line)}
  button.primary{background:var(--accent); color:#1a0d06; border-color:var(--accent); font-weight:600}
  button.primary:hover{filter:brightness(1.1); color:#1a0d06}
  .fb{margin-top:16px; min-height:120px}
  .verdict{font-size:14px; font-weight:600; margin-bottom:11px; display:flex; align-items:center; gap:8px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.hint{color:var(--hint)}
  .card{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:15px 17px}
  .kanji{font-size:31px; font-weight:600; letter-spacing:.04em}
  .kanji.long{font-size:24px}
  .kana{font-size:14px; color:var(--dim); margin-top:5px}
  .meta{font-size:12px; color:var(--dim); margin-top:9px; padding-top:9px; border-top:1px solid var(--line); line-height:1.6}
  .yours{font-size:12px; color:var(--dim); margin-top:10px}
  .yours b{color:var(--bad); font-weight:600}
  .hrow{display:flex; gap:11px; align-items:flex-start}
  .hrow.more{margin-top:13px; padding-top:13px; border-top:1px solid var(--line)}
  .hnum{flex:none; width:19px; height:19px; border-radius:50%; background:var(--line); color:var(--dim);
        font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:2px}
  .fam{font-size:15.5px; line-height:2.05}
  .fam.plain{line-height:1.6; font-size:15px}
  .fam ruby{ruby-position:over; -webkit-ruby-position:before}
  .fam rt{color:#79c2ff; font-size:.52em; font-weight:400; letter-spacing:.02em;
          transform:translateY(2px); user-select:none}
  .famen{font-size:12.5px; color:var(--dim); line-height:1.55; margin-top:6px}
  .foot{padding:13px 22px; border-top:1px solid var(--line); font-size:11px; color:#606a7c; display:flex; gap:14px; flex-wrap:wrap}
  kbd{background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 5px; font-size:10px; font-family:inherit}
  .credit{flex-basis:100%; color:#4d566a; font-size:10px}
  /* ---------- results ---------- */
  .results{display:flex; flex-direction:column; gap:14px}
  .big{font-size:44px; font-weight:700; line-height:1}
  .misslist{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .missrow{background:var(--panel2); padding:9px 13px; display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .missrow span:last-child{font-size:11px; color:var(--dim); text-align:right}
  .hidden{display:none}
  /* tablets keep two columns; only phones get the sheet */
  @media (max-width:900px) and (min-width:721px){
    .app{grid-template-columns:minmax(0,1fr) 320px}
  }
  /* ---------- phone: full-bleed map, quiz in a bottom sheet ---------- */
  @media (max-width:720px) and (min-height:501px){
    html,body{overflow:hidden; overscroll-behavior:none}
    .app{display:block; height:100dvh}
    .mapwrap{position:fixed; top:var(--vtop,0px); left:0; right:0; height:var(--band,52vh);
             padding-top:env(safe-area-inset-top,0px)}
    .mapui{right:12px; bottom:12px}
    .mapui button{width:44px; height:44px}
    .locator{left:12px; bottom:12px; width:84px}
    .maptop{top:calc(10px + env(safe-area-inset-top,0px)); left:12px; right:12px}
    .maptip{bottom:auto; top:calc(12px + env(safe-area-inset-top,0px))}
    .panel{position:fixed; left:0; right:0; bottom:var(--kb,0px); height:var(--sheet,44vh);
           border-left:0; border-top:1px solid var(--line); border-radius:18px 18px 0 0;
           box-shadow:0 -10px 30px rgba(0,0,0,.45); z-index:5; touch-action:none;
           transition:height .22s cubic-bezier(.4,0,.2,1)}
    .panel.noanim{transition:none}
    .sheetgrip{display:block; flex:none; padding:11px 16px 0}
    .chipslot{display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none}
    .chipslot::-webkit-scrollbar{display:none}
    .chip{height:36px; padding:0 14px; flex:none}
    .phead{display:none}
    .stats{padding:2px 16px 0; border-bottom:0}
    .stat{flex:none; padding:8px 0; margin-right:16px; text-align:left; border-right:0;
          display:flex; align-items:baseline; gap:5px}
    .snum{font-size:15px}
    .slab{margin-top:0}
    .bar{margin:0 16px; border-radius:2px}
    .body{padding:14px 16px 0; touch-action:pan-y}   /* the card scrolls, the sheet doesn't */
    input[type=text]{font-size:17px; height:52px; padding:0 15px}
    button{min-height:46px}
    .row{gap:9px}
    .row button{flex:1}
    .fb{min-height:0; margin-top:14px}
    .foot{padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
    .foot .kbhint{display:none}
    /* peek: nothing but the answer line, docked above the keyboard */
    .panel.peek .stats, .panel.peek .bar, .panel.peek .prompt,
    .panel.peek .fb, .panel.peek .foot, .panel.peek .sheetgrip{display:none}
    .panel.peek .body{padding:8px 16px 10px; position:relative}
    .panel.peek #answer{width:calc(100% - 96px)}
    .panel.peek .row{position:absolute; top:8px; right:16px; margin:0}
    .panel.peek .row #hintBtn, .panel.peek .row #revealBtn{display:none}
    .panel.peek #submitBtn{height:52px}
  }
  @media (max-height:500px){
    .app{display:grid; grid-template-columns:minmax(0,1fr) 300px; height:100dvh}
    .mapwrap{position:static; height:auto; padding-top:0}
    .panel{position:static; height:auto; bottom:auto; border-left:1px solid var(--line);
           border-top:0; border-radius:0; box-shadow:none}
    .sheetgrip, .phead, .foot{display:none}
    .stats{padding:0}
    .stat{padding:9px 6px}
    .snum{font-size:17px}
    .body{padding:14px 16px}
    .fb{min-height:0; margin-top:12px}
    .maptop{top:10px; left:12px; right:12px}
    .mapui{right:12px; bottom:12px}
    .locator{left:12px; bottom:12px; width:76px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <div class="maptop" id="chipHome"></div>
    <div class="chipbar" id="chipbar" style="display:flex; gap:8px; align-items:center; width:100%">
      <button class="chip country" id="countryBtn">🇯🇵 日本</button>
      <button class="chip mode" id="modeBtn">都道府県を当てる</button>
      <button class="chip" id="scopeBtn">全国 · all Japan</button>
      <div class="spacer"></div>
      <button class="chip" id="namesBtn">名前を表示</button>
    </div>
    <svg id="map" preserveAspectRatio="xMidYMid meet">
      <g id="gOos"></g>
      <g id="gOutline"></g>
      <g id="gIn"></g>
      <rect id="insetbox" rx="6"></rect>
      <text id="insetlabel"></text>
      <g id="labels"></g>
      <circle id="ring" class="pulse" cx="0" cy="0" r="0"></circle>
    </svg>
    <div class="mapui">
      <button id="zInBtn">＋</button>
      <button id="zOutBtn">−</button>
      <button id="zFitBtn" class="sm"></button>
      <button id="zHomeBtn" class="sm"></button>
    </div>
    <div class="locator" id="locator">
      <svg id="locmap" preserveAspectRatio="xMidYMid meet">
        <g id="locpaths"></g>
        <rect id="locvp" rx="12"></rect>
      </svg>
    </div>
    <div class="maptip" id="maptip"></div>
  </div>

  <div class="panel">
    <div class="sheetgrip" id="sheetgrip">
      <div class="chipslot" id="chipslot"></div></div>
    <div class="phead">
      <div class="title" id="hTitle">都道府県クイズ</div>
      <div class="sub" id="hSub">Name the highlighted prefecture</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="snum" id="sScore">0</div><div class="slab">correct</div></div>
      <div class="stat"><div class="snum" id="sSeen">0/47</div><div class="slab">progress</div></div>
      <div class="stat"><div class="snum" id="sStreak">0</div><div class="slab">streak</div></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>

    <div class="body">
      <div id="playView">
        <div class="prompt" id="prompt"></div>
        <input type="text" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="row">
          <button class="primary" id="submitBtn"></button>
          <button id="hintBtn"></button>
          <button id="revealBtn"></button>
        </div>
        <div class="fb" id="fb"></div>
      </div>
      <div id="resultView" class="hidden"></div>
    </div>

    <div class="foot" id="foot"></div>
  </div>
</div>

// A prefecture answers to its full name and its bare name, in kanji, kana and
// romaji. The normaliser never strips an ending itself, so 京都 stays 京都.
const JP_SUFFIX = /(県|府|都|道)$/;
const JP_ENDER = {'県':['けん','ken'], '府':['ふ','fu'], '都':['と','to'], '道':['どう','do']};

function katakanaToHiragana(s){
  return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function jpNorm(s){
  s = (s||'').trim().toLowerCase().normalize('NFKC');
  s = s.replace(/[ōô]/g,'o').replace(/[ūû]/g,'u').replace(/[āâ]/g,'a')
       .replace(/[ēê]/g,'e').replace(/[īî]/g,'i');
  s = s.replace(/[\s　'’\-_.・･]/g,'');
  s = katakanaToHiragana(s);
  s = s.replace(/(地方|ちほう)$/,'');
  // long vowels are only ambiguous in romaji: tokyo == toukyou == tōkyō, gunma == gumma
  if (/^[a-z]+$/.test(s)) s = s.replace(/mm/g,'nm').replace(/ou/g,'o').replace(/oo/g,'o').replace(/uu/g,'u');
  return s;
}
const jpCap = s => s.charAt(0).toUpperCase() + s.slice(1);

                               .filter(i => MAPS.uk.units[i].nation === n);

// Spelling is forgiving: case, spaces, hyphens, apostrophes, accents and "&" all
// go, and so does a leading "the", "county", "city of" or "isle of" — so County
// Down, county down and Down are one answer, and Ynys Môn matches ynys mon.
function ukNorm(s){
  s = (s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s = s.replace(/&/g,'and').replace(/[^a-z0-9]+/g,'');
  s = s.replace(/^(theisleof|isleof|cityof|countyof|county|the)(?=.)/,'');
  return s;
}

// "Scotland · Scotland"; say what kind of thing it is instead.

  const n = MAPS.uk.units[id].nation;
  return n === 'eng' ? UK_REGION_OF[id].name + ' · England'
                     : NATION[n] + ' · ' + UK_LAYER[n];
}

// =================================================================== engine ===
// Everything below is country-agnostic: it asks the active pack for names,
// readings, hints and wording, and never looks at a language of its own.
const PACKS = [PACK_JP, PACK_UK];
let P = null;                // active pack
let MAP = null;              // P.map — paths, viewBox, inset box
let REGION_OF = {}, REGION_BY_KEY = {}, IDS = [];

const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const svg = $('#map');
const gOos = $('#gOos'), gOutline = $('#gOutline'), gIn = $('#gIn');
const labels = $('#labels'), ring = $('#ring'), locpaths = $('#locpaths');
const insetbox = $('#insetbox'), insetlabel = $('#insetlabel');
const mapwrap = document.querySelector('.mapwrap');
const locator = $('#locator'), locvp = $('#locvp'), maptip = $('#maptip');
const input = $('#answer'), fb = $('#fb');

let nodes = {};              // unit id -> <path>
const MINPPU = {};           // unit id -> px-per-unit at which its name fits

// ---------- game state ----------
let mode = 'unit';           // 'unit' = name the county/prefecture, 'region' = name the region
let scope = null;            // filter, unit mode only
let si = 0;                  // index into P.scopes
let queue = [], current = null, idx = 0, score = 0, streak = 0, best = 0;
let attempts = 0, awaitingNext = false, missed = [], hintLevel = 0, nextTimer = 0;
const CORRECT_MS = 800;      // how long a right answer stays on screen before the next one

const scopeIds = () => mode === 'region' ? IDS : (scope.ids || IDS);
const inScope = id => mode === 'region' || !scope.ids || scope.ids.includes(id);
const keyOf = id => mode === 'region' ? REGION_OF[id].key : id;
const isTarget = id => current !== null && keyOf(id) === current;
const nameOf = k => mode === 'region' ? P.regionName(REGION_BY_KEY[k]) : P.nameOf(k);
const subOf  = k => mode === 'region' ? P.regionSub(REGION_BY_KEY[k])  : P.subOf(k);
const metaOf = k => mode === 'region' ? P.regionMeta(REGION_BY_KEY[k]) : P.metaOf(k);
const hintsOf = k => mode === 'region' ? REGION_BY_KEY[k].hints : P.hintsOf(k);

function accepted(k){
  const list = mode === 'region' ? P.regionVariants(REGION_BY_KEY[k]) : P.unitVariants(k);
  const set = new Set(list.map(P.norm));
  set.delete('');
  return set;
}

// ---------- building the map ----------
function buildMap(){
  gIn.textContent = ''; gOos.textContent = ''; gOutline.textContent = '';
  labels.textContent = ''; locpaths.textContent = '';
  nodes = {};
  IDS = Object.keys(MAP.units).map(Number).sort((a,b) => a-b);

  const box = '0 0 ' + MAP.w + ' ' + MAP.h;
  svg.setAttribute('viewBox', box);
  $('#locmap').setAttribute('viewBox', box);

  const ins = MAP.inset;
  for (const [k, v] of [['x',ins.x],['y',ins.y],['width',ins.w],['height',ins.h]])
    insetbox.setAttribute(k, v);
  insetlabel.setAttribute('x', ins.x + 9);
  insetlabel.textContent = MAP.insetLabel;   // applyView sizes and places it

  for (const id of IDS){
    const u = MAP.units[id];
    const el = document.createElementNS(SVGNS,'path');
    el.setAttribute('d', u.d);
    el.setAttribute('class','pref');
    el.dataset.id = id;
    gIn.appendChild(el);
    nodes[id] = el;

    const t = document.createElementNS(SVGNS,'text');
    t.setAttribute('class','lbl');
    t.setAttribute('x', u.c[0]); t.setAttribute('y', u.c[1] + 5);
    t.textContent = P.mapLabel(id);
    labels.appendChild(t);

    // px the name needs / units the county spans = the px-per-unit it reads at
    const span = Math.max(u.b[2] - u.b[0], u.b[3] - u.b[1]);
    MINPPU[id] = Math.max(t.textContent.length * 13, 40) / span;

    const o = document.createElementNS(SVGNS,'path');
    o.setAttribute('d', u.d);
    locpaths.appendChild(o);
  }
  labels.style.display = showNames ? '' : 'none';
}

// ---------- map view: one [x,y,w,h] written to the viewBox ----------
// Strokes already carry vector-effect:non-scaling-stroke, so only text needs
// counter-scaling; everything else holds its weight at any zoom.
const MAXSCALE = 12;
let view = null, home = null, userFramed = false, animRAF = 0;

const wrapBox = () => svg.getBoundingClientRect();
const scaleOf = () => home[2] / view[2];

// the whole map, letterboxed into the current container
function homeFrame(){
  const r = wrapBox(), a = (r.width / r.height) || 1;
  let w = MAP.w, h = MAP.w / a;
  if (h < MAP.h){ h = MAP.h; w = MAP.h * a; }
  return [(MAP.w - w) / 2, (MAP.h - h) / 2, w, h];
}

function clampView(v){
  return [Math.min(Math.max(v[0], home[0]), home[0] + home[2] - v[2]),
          Math.min(Math.max(v[1], home[1]), home[1] + home[3] - v[3]), v[2], v[3]];
}

function applyView(){
  svg.setAttribute('viewBox', view.map(n => Math.round(n * 10) / 10).join(' '));
  const ppu = wrapBox().width / view[2];           // rendered px per map unit
  labels.style.fontSize = (13 / ppu) + 'px';
  // the inset label is held to 15 screen px, but never wider than its own box —
  // otherwise it spills out over the sea once the map is drawn small on a phone
  const insF = Math.min(15 / ppu, (MAP.inset.w - 16) / (MAP.insetLabel.length * 0.62));
  insetlabel.style.fontSize = insF + 'px';
  insetlabel.setAttribute('y', MAP.inset.y + MAP.inset.h - insF * 0.45);
  // a name only earns its place once its county is big enough to hold it
  for (let i = 0; i < IDS.length; i++)
    labels.children[i].style.display = ppu >= MINPPU[IDS[i]] ? '' : 'none';
  const s = scaleOf();
  ring.classList.toggle('faded', s > 2.5);
  locator.classList.toggle('on', s > 1.6);
  locvp.setAttribute('x', view[0]); locvp.setAttribute('y', view[1]);
  locvp.setAttribute('width', view[2]); locvp.setAttribute('height', view[3]);
  $('#zOutBtn').disabled = s <= 1.001;
  $('#zInBtn').disabled = s >= MAXSCALE - .001;
}

// the point under the cursor or the pinch midpoint stays put
function zoomAt(cx, cy, k){
  cancelAnimationFrame(animRAF);
  const r = wrapBox();
  const px = view[0] + (cx - r.left) / r.width * view[2];
  const py = view[1] + (cy - r.top) / r.height * view[3];
  const w = Math.min(Math.max(view[2] / k, home[2] / MAXSCALE), home[2]);
  const h = w * view[3] / view[2];
  view = clampView([px - (px - view[0]) * (w / view[2]),
                    py - (py - view[1]) * (h / view[3]), w, h]);
  applyView();
}

function easeTo(to, ms){
  cancelAnimationFrame(animRAF);
  const from = view.slice(), t0 = performance.now();
  const step = now => {
    const t = Math.min((now - t0) / ms, 1);
    const e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    view = from.map((v, i) => v + (to[i] - v) * e);
    applyView();
    if (t < 1) animRAF = requestAnimationFrame(step);
  };
  animRAF = requestAnimationFrame(step);
}

function frameOn(bb, pad){
  const r = wrapBox(), a = (r.width / r.height) || 1;
  const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
  const w = Math.min(Math.max((bb[2] - bb[0]) * (1 + pad*2), (bb[3] - bb[1]) * (1 + pad*2) * a,
                              home[2] / MAXSCALE), home[2]);
  return clampView([cx - w/2, cy - w/a/2, w, w/a]);
}

const bboxOf = ids => ids.reduce((a, i) => {
  const b = MAP.units[i].b;
  return [Math.min(a[0],b[0]), Math.min(a[1],b[1]), Math.max(a[2],b[2]), Math.max(a[3],b[3])];
}, [1e9, 1e9, -1e9, -1e9]);

// Never tighter than the region: the county alone would hand over the answer.
// The inset unit lives in its box, so its region's bbox would frame half the country.
function questionBox(){
  if (mode === 'region') return null;
  if (+current === MAP.insetId) return [MAP.inset.x, MAP.inset.y,
                                        MAP.inset.x + MAP.inset.w, MAP.inset.y + MAP.inset.h];
  const ids = REGION_OF[current].ids.filter(i => i !== MAP.insetId);
  return bboxOf(ids.length ? ids : REGION_OF[current].ids);
}

// Only on a phone, only when the visible band is too short for the whole country,
// and never over a gesture the player made themselves.
function autoFrame(anim){
  if (!view || userFramed || current === null) return;
  const tight = isPhone() && (snap === 'peek' || document.activeElement === input ||
                              wrapBox().height < viewportH() * 0.45);
  const bb = tight ? questionBox() : null;
  const to = bb ? frameOn(bb, 0.12) : home.slice();
  if (anim === false) { view = to; applyView(); } else easeTo(to, 320);
}

function relayout(){
  const prev = home, prevView = view;
  home = homeFrame();
  if (!prevView) view = home.slice();
  else {
    const s = prev ? prev[2] / prevView[2] : 1;
    const cx = prevView[0] + prevView[2]/2, cy = prevView[1] + prevView[3]/2;
    const w = home[2] / s, h = home[3] / s;
    view = clampView([cx - w/2, cy - h/2, w, h]);
  }
  applyView();
}

// ---------- painting ----------
// every unit's colour is derived from state, so results stay painted
function paint(){
  for (const id of IDS){
    const c = ['pref'];
    if (!inScope(id)) c.push('oos');
    const res = results[keyOf(id)];
    if (isTarget(id) && !awaitingNext) c.push('target');
    else if (res) c.push(res);
    nodes[id].setAttribute('class', c.join(' '));
  }
}

// out-of-scope fills first, then the scope outline, then in-scope fills on top:
// each in-scope path's stroke is covered by its neighbours' fills, leaving the outer edge
function layout(){
  const ids = scopeIds();
  gOutline.textContent = '';
  for (const id of IDS) (ids.includes(id) ? gIn : gOos).appendChild(nodes[id]);
  if (mode === 'unit' && scope.ids){
    for (const id of ids){
      const o = document.createElementNS(SVGNS,'path');
      o.setAttribute('d', MAP.units[id].d);
      gOutline.appendChild(o);
    }
  }
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; }

// ---------- rounds ----------
function startRound(items){
  queue = shuffle(items ? items.slice()
        : mode === 'region' ? P.regions.map(r => r.key) : (scope.ids || IDS).slice());
  idx = 0; score = 0; streak = 0; missed = []; results = {}; current = null;
  $('#playView').classList.remove('hidden');
  $('#resultView').classList.add('hidden');
  layout();
  next();
}

function next(keepFocus){
  clearTimeout(nextTimer); nextTimer = 0;
  if (idx >= queue.length) return finish();
  current = queue[idx];
  attempts = 0; awaitingNext = false; hintLevel = 0;
  $('#hintBtn').disabled = false; $('#hintBtn').textContent = P.t.hint;
  $('#revealBtn').disabled = false;
  paint(); placeRing('');
  userFramed = false; autoFrame();
  input.value = ''; input.className = ''; input.disabled = false;
  // a fresh round opens on the map — the whole country IS the first question, so don't
  // summon the keyboard over it. Rolling on mid-round keeps the box (and keyboard) live.
  if (!isPhone() || keepFocus) input.focus();
  fb.innerHTML = '';
  $('#submitBtn').textContent = P.t.answer;
  updateStats();
}

function placeRing(cls){
  if (mode === 'region'){ ring.setAttribute('r', 0); return; }   // the region is coloured already
  const b = MAP.units[current].b;
  const cx = (b[0]+b[2])/2, cy = (b[1]+b[3])/2;
  const r = Math.max(Math.hypot(b[2]-b[0], b[3]-b[1]) / 2 + 26, 46);
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', r);
  ring.setAttribute('class', 'pulse ' + cls);
}

function updateStats(){
  $('#sScore').textContent = score;
  $('#sSeen').textContent = idx + '/' + queue.length;
  $('#sStreak').textContent = streak;
  $('#bar').style.width = (queue.length ? idx/queue.length*100 : 0) + '%';
}

function card(k, extra){
  const name = nameOf(k);
  return '<div class="card"><div class="kanji' + (name.length > 15 ? ' long' : '') + '">' +
    name + '</div><div class="kana">' + subOf(k) + '</div>' +
    '<div class="meta">' + metaOf(k) + '</div></div>' + (extra || '');
}

function advance(){
  clearTimeout(nextTimer); nextTimer = 0;
  idx++; next(true);
}

function submit(){
  if (awaitingNext){ advance(); return; }
  const raw = input.value.trim();
  if (!raw) return;
  if (accepted(current).has(P.norm(raw))) {
    score++; streak++; best = Math.max(best, streak);
    results[current] = 'correct';
    awaitingNext = true;
    paint(); placeRing('ok');
    input.className = 'ok';
    fb.innerHTML = '<div class="verdict ok">' + P.t.correct + '</div>' + card(current);
    $('#hintBtn').disabled = true; $('#revealBtn').disabled = true;
    // right answers roll straight on: the box keeps focus, so the keyboard never drops
    // and the map re-frames on the next question without another tap
    nextTimer = setTimeout(advance, CORRECT_MS);
  } else {
    attempts++; streak = 0;
    input.classList.remove('shake'); void input.offsetWidth; input.className = 'bad shake';
    if (attempts < 2) {
      fb.innerHTML = '<div class="verdict bad">' + P.t.retry + '</div>' +
        '<div class="yours">' + P.t.yours + '<b>' + escapeHtml(raw) + '</b></div>';
      input.select();
    } else {
      reveal(raw);
    }
  }
  updateStats();
}

function reveal(raw){
  results[current] = 'wrong';
  missed.push(current);
  streak = 0;
  awaitingNext = true;
  paint(); placeRing('bad');
  input.disabled = true; input.className = 'bad';
  const yours = raw ? '<div class="yours">' + P.t.yours + '<b>' + escapeHtml(raw) + '</b></div>' : '';
  fb.innerHTML = '<div class="verdict bad">' + P.t.theAnswer + '</div>' + card(current, yours);
  endQuestion();
  updateStats();
}

function endQuestion(){
  setSnap('half');                       // let the answer card through on a phone
  $('#hintBtn').disabled = true;
  $('#revealBtn').disabled = true;
  $('#submitBtn').textContent = idx + 1 >= queue.length ? P.t.seeResults : P.t.next;
  $('#submitBtn').focus();
}

// three facts, revealed one at a time; earlier ones stay on screen
function hint(){
  if (awaitingNext || hintLevel >= 3) return;
  hintLevel++;
  const rows = hintsOf(current).slice(0, hintLevel).map((h, i) =>
    '<div class="hrow' + (i ? ' more' : '') + '"><span class="hnum">' + (i+1) + '</span>' +
    '<div>' + P.hintHtml(h) + '</div></div>').join('');
  fb.innerHTML = '<div class="verdict hint">' + P.t.hintHead +
    ' &nbsp;<span style="color:var(--dim);font-weight:400">' +
    hintLevel + '/3</span></div><div class="card">' + rows + '</div>';
  if (hintLevel >= 3) $('#hintBtn').disabled = true;
  else $('#hintBtn').textContent = P.t.more;
  if (isPhone()) { input.blur(); setSnap('full'); } else input.focus();
}

function finish(){
  current = null;
  input.blur();
  ring.setAttribute('r', 0);
  paint();
  userFramed = false;
  if (view) easeTo(home.slice(), 320);
  setSnap('full');
  const pct = Math.round(score / queue.length * 100);
  const rows = missed.map(k =>
    '<div class="missrow"><span>' + nameOf(k) + '</span><span>' + subOf(k) + '</span></div>').join('');
  $('#playView').classList.add('hidden');
  const rv = $('#resultView');
  rv.classList.remove('hidden');
  const label = mode === 'region' ? P.t.titleRegion : scope.name;
  rv.innerHTML = '<div class="results">' +
    '<div><div class="big">' + score + ' / ' + queue.length + '</div>' +
    '<div class="sub" style="margin-top:6px">' + pct + '% · ' + P.t.bestStreak + ' ' + best + '</div></div>' +
    (missed.length
      ? '<div><div class="prompt">' + (mode === 'region' ? P.t.missedRegion : P.t.missedUnit) +
        ' (' + missed.length + ')</div><div class="misslist">' + rows + '</div></div>'
      : '<div class="verdict ok">' + P.t.perfect + '</div>') +
    '<div class="row"><button class="primary" id="againBtn">' + P.t.again + ' (' + label + ')</button>' +
    (missed.length ? '<button id="reviewBtn">' + P.t.reviewMissed(missed.length) + '</button>' : '') +
    '</div></div>';
  $('#againBtn').onclick = () => startRound();
  const rb = $('#reviewBtn'); if (rb) { const m = missed.slice(); rb.onclick = () => startRound(m); }
  updateStats();
  $('#sSeen').textContent = queue.length + '/' + queue.length;
  $('#bar').style.width = '100%';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- chrome that follows the active pack ----------
function applyStrings(){
  const t = P.t, isRegion = mode === 'region';
  document.documentElement.lang = P.lang;
  document.title = t.docTitle;
  $('#countryBtn').textContent = P.chip;
  $('#modeBtn').textContent = isRegion ? t.toRegion : t.toUnit;
  $('#scopeBtn').classList.toggle('hidden', isRegion);
  $('#scopeBtn').textContent = scope.label;
  $('#hTitle').textContent = isRegion ? t.titleRegion : t.titleUnit;
  $('#hSub').textContent = isRegion ? t.subRegion : t.subUnit;
  $('#prompt').innerHTML = isRegion ? t.promptRegion : t.promptUnit;
  input.placeholder = isRegion ? t.phRegion : t.phUnit;
  $('#namesBtn').textContent = showNames ? t.hideNames : t.showNames;
  $('#zInBtn').title = t.zoomIn;
  $('#zOutBtn').title = t.zoomOut;
  $('#zFitBtn').textContent = t.fit;   $('#zFitBtn').title = t.fitTitle;
  $('#zHomeBtn').textContent = t.whole; $('#zHomeBtn').title = t.wholeTitle;
  locator.title = t.locator;
  $('#foot').innerHTML = t.kb.map(k => '<span class="kbhint">' + k + '</span>').join('') +
    '<span id="restartFoot" style="cursor:pointer;text-decoration:underline">' + t.restart + '</span>' +
    (t.credit ? '<span class="credit">' + t.credit + '</span>' : '');
  $('#restartFoot').onclick = () => startRound();
}

function setPack(pack){
  P = pack;
  MAP = P.map;
  REGION_OF = {}; REGION_BY_KEY = {};
  P.regions.forEach(r => { REGION_BY_KEY[r.key] = r; r.ids.forEach(id => REGION_OF[id] = r); });
  si = 0; scope = P.scopes[0];
  mode = 'unit';
  best = 0;
  buildMap();
  applyStrings();
  view = null; home = null;
  syncLayout();
  startRound();
}

// ---------- controls ----------
$('#submitBtn').onclick = submit;
$('#hintBtn').onclick = hint;
$('#revealBtn').onclick = () => { if (!awaitingNext) reveal(input.value.trim()); };

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); }
});
document.addEventListener('keydown', e => {
  if (e.target === input) return;
  if ((e.key === 'Enter' || e.key === ' ') && awaitingNext) { e.preventDefault(); submit(); }
  if (e.key === '?') { e.preventDefault(); hint(); }
});

$('#countryBtn').onclick = () => {
  setPack(PACKS[(PACKS.indexOf(P) + 1) % PACKS.length]);
};

$('#modeBtn').onclick = () => {
  mode = mode === 'unit' ? 'region' : 'unit';
  applyStrings();
  startRound();
};

$('#scopeBtn').onclick = () => {
  si = (si + 1) % P.scopes.length;
  scope = P.scopes[si];
  $('#scopeBtn').textContent = scope.label;
  startRound();
};

let showNames = false;
$('#namesBtn').onclick = () => {
  showNames = !showNames;
  labels.style.display = showNames ? '' : 'none';
  $('#namesBtn').classList.toggle('on', showNames);
  $('#namesBtn').textContent = showNames ? P.t.hideNames : P.t.showNames;
};

svg.addEventListener('mousemove', e => {
  const el = e.target.closest('.pref'); if (!el || !showNames) return;
  el.classList.add('hovered');
  el.addEventListener('mouseleave', () => el.classList.remove('hovered'), {once:true});
});

// ---------- map: pan, zoom, and tap-to-inspect ----------
let tipTimer = 0;
function showInfo(id){
  maptip.innerHTML = P.tipOf(id);
  maptip.classList.add('on');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => maptip.classList.remove('on'), 2800);
}

const pointers = new Map();
let gesture = null, moved = 0, downOn = null;

const onMap = e => !e.target.closest('.mapui, .locator, .maptop, .chipbar');

mapwrap.addEventListener('pointerdown', e => {
  if (!onMap(e)) return;
  mapwrap.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  gesture = null; moved = 0;
  downOn = e.target.closest('.pref');
  mapwrap.classList.add('dragging');
});
mapwrap.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const a = [...pointers.values()], r = wrapBox();
  if (a.length === 1){
    if (gesture && gesture.n === 1){
      const dx = a[0].x - gesture.x, dy = a[0].y - gesture.y;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 5){
        userFramed = true;
        cancelAnimationFrame(animRAF);
        view = clampView([view[0] - dx * view[2] / r.width,
                          view[1] - dy * view[3] / r.height, view[2], view[3]]);
        applyView();
      }
    }
    gesture = {n: 1, x: a[0].x, y: a[0].y};
  } else {
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (gesture && gesture.n === 2 && gesture.d > 0){
      userFramed = true; moved = 99;
      zoomAt((a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2, d / gesture.d);
    }
    gesture = {n: 2, d: d};
  }
});
const endPointer = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  gesture = null;
  if (!pointers.size){
    mapwrap.classList.remove('dragging');
    // a tap, not a drag
    if (moved <= 5 && showNames && downOn) showInfo(+downOn.dataset.id);
    downOn = null;
  }
};
mapwrap.addEventListener('pointerup', endPointer);
mapwrap.addEventListener('pointercancel', endPointer);

mapwrap.addEventListener('wheel', e => {
  if (!onMap(e)) return;
  e.preventDefault();
  userFramed = true;
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, {passive: false});

mapwrap.addEventListener('dblclick', e => {
  if (!onMap(e)) return;
  e.preventDefault();
  userFramed = false; autoFrame();
});

let lastTap = 0;
mapwrap.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' || !onMap(e) || moved > 5) return;
  const now = Date.now();
  if (now - lastTap < 300){ userFramed = false; autoFrame(); lastTap = 0; }
  else lastTap = now;
});

const stepZoom = k => {
  const r = wrapBox();
  userFramed = true;
  zoomAt(r.left + r.width/2, r.top + r.height/2, k);
};
$('#zInBtn').onclick = () => stepZoom(1.7);
$('#zOutBtn').onclick = () => stepZoom(1/1.7);
$('#zHomeBtn').onclick = () => { userFramed = true; easeTo(home.slice(), 300); };
$('#zFitBtn').onclick = () => {
  userFramed = true;
  const bb = questionBox();
  easeTo(bb ? frameOn(bb, 0.12) : home.slice(), 320);
};
locator.onclick = () => { userFramed = true; easeTo(home.slice(), 300); };

document.addEventListener('keydown', e => {
  if (e.target === input || e.metaKey || e.ctrlKey) return;
  if (e.key === '+' || e.key === '=') { e.preventDefault(); stepZoom(1.7); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); stepZoom(1/1.7); }
  else if (e.key === '0') { e.preventDefault(); userFramed = true; easeTo(home.slice(), 300); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); $('#zFitBtn').onclick(); }
});

// ---------- phone: the sheet, and keeping the map clear of the keyboard ----------
const app = document.querySelector('.app');
const panel = document.querySelector('.panel');
const chipbar = $('#chipbar');
const phoneMQ = window.matchMedia('(max-width:720px) and (min-height:501px)');
const vv = window.visualViewport;
const PEEK = 72;             // 8px + the 52px box + 10px — .panel.peek .body, plus its border
let snap = 'half';

const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;bottom:0;left:0;width:0;pointer-events:none;' +
                          'height:env(safe-area-inset-bottom,0px)';
document.body.appendChild(safeProbe);

const isPhone = () => phoneMQ.matches;
const viewportH = () => (vv ? vv.height : window.innerHeight);
const keyboardH = () => vv ? Math.max(0, window.innerHeight - (vv.height + vv.offsetTop)) : 0;

function snapHeight(name, h, kb){
  if (name === 'peek') return PEEK + (kb ? 0 : safeProbe.offsetHeight);
  const want = name === 'full' ? h * 0.86 : h * 0.46;
  return Math.round(Math.min(Math.max(want, 240), h - 150));
}

function syncLayout(){
  const phone = isPhone();
  // the chips sit over the map on a desktop and in the sheet's grip on a phone,
  // where the map's top corner belongs to the far north and the inset box
  const host = phone ? $('#chipslot') : $('#chipHome');
  if (chipbar.parentNode !== host) host.appendChild(chipbar);
  if (!phone){
    for (const v of ['--band','--sheet','--kb','--vtop']) app.style.removeProperty(v);
    panel.classList.remove('peek');
    relayout();
    return;
  }
  const h = viewportH(), kb = keyboardH();
  const sheet = snapHeight(snap, h, kb);
  app.style.setProperty('--vtop', (vv ? vv.offsetTop : 0) + 'px');
  app.style.setProperty('--kb', kb + 'px');
  app.style.setProperty('--sheet', sheet + 'px');
  app.style.setProperty('--band', (h - sheet) + 'px');
  panel.classList.toggle('peek', snap === 'peek');
  relayout();
  autoFrame();
}

function setSnap(name){
  if (!isPhone() || snap === name) return;
  snap = name;
  syncLayout();
}

// the sheet's bottom edge follows the keyboard instantly, so animating its height on top
// of that is what made the answer box hop up and back down before settling
function instantly(fn){
  panel.classList.add('noanim');
  fn();
  void panel.offsetHeight;                 // land the new height in this same frame
  requestAnimationFrame(() => panel.classList.remove('noanim'));
}

// the keyboard opening is the signal to collapse, not focus — a blur while tapping
// a button would otherwise reflow the sheet out from under the tap
if (vv){
  const onVV = () => {
    if (!isPhone()) return;
    const kb = keyboardH();
    if (kb > 100 && snap !== 'peek') { snap = 'peek'; }
    else if (kb <= 100 && snap === 'peek') { snap = 'half'; }
    if (vv.offsetTop) window.scrollTo(0, 0);
    instantly(syncLayout);
  };
  vv.addEventListener('resize', onVV);
  vv.addEventListener('scroll', onVV);
} else {
  input.addEventListener('focus', () => setSnap('peek'));
  input.addEventListener('blur', () => setSnap('half'));
}
for (const id of ['#submitBtn', '#hintBtn', '#revealBtn'])
  $(id).addEventListener('mousedown', e => e.preventDefault());   // tapping must not blur

// The sheet is driven by the game and by the keyboard, never dragged by hand: a sheet
// raised over the map had no way back down while the keyboard pinned it there.

// Reaching for the answer box is the cue to frame the question — waiting for the
// keyboard to resize the viewport missed the very first one on some browsers.
input.addEventListener('focus', () => { if (isPhone()) autoFrame(); });

// The map is a fixed window you pan and zoom *inside*; dragging the sheet, or any
// bare ground beside it, used to scroll the whole page out from under the keyboard.
// Only the answer card, which can outgrow its sheet, still scrolls.
document.addEventListener('touchmove', e => {
  if (!e.cancelable || (e.target.closest && e.target.closest('.body'))) return;
  e.preventDefault();      // the map's own pan/pinch runs on pointer events, untouched
}, {passive: false});

phoneMQ.addEventListener('change', syncLayout);
window.addEventListener('resize', syncLayout);
window.addEventListener('orientationchange', () => setTimeout(syncLayout, 250));

setPack(PACKS[0]);
</script>
</body>
</html>
